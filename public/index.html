<style>
:root{--bg:#e8e8ea;--card:#f9f9f9;--ink:#26262a;--mute:#69696f;--line:#cbcbd0;--accent:#ffc21a;--on:#1f1f22;--ok:#26262a}
@media (prefers-color-scheme:dark){:root{--bg:#1d1d20;--card:#2a2a2e;--ink:#f1f1f2;--mute:#a7a7ad;--line:#3f3f44;--accent:#ffc21a;--on:#1f1f22;--ok:#ffc21a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;line-height:1.5}
body{border-top:8px solid #ffc21a}
main{max-width:520px;margin:0 auto;padding:28px 18px 48px}
h1{font-size:30px;line-height:1.15;margin:0 0 6px;font-weight:800}
p.sub{margin:0 0 24px;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;margin-bottom:14px}
h2{font-size:15px;margin:0 0 12px;font-weight:600;color:var(--mute)}
.grid{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:18px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer}
.chip small{display:block;font-weight:400;color:var(--mute);font-size:12px}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on)}
.chip[aria-pressed=true] small{color:inherit}
.chip:disabled{opacity:.4;cursor:not-allowed;text-decoration:line-through}
.chip:focus-visible,input:focus-visible,.go:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
label{display:block;font-weight:600;font-size:14px;margin-bottom:12px}
input{width:100%;margin-top:6px;padding:12px;border:1px solid var(--line);border-radius:16px;font:inherit;background:transparent;color:var(--ink)}
.go{width:100%;padding:15px;border:0;border-radius:999px;background:var(--accent);color:var(--on);font:inherit;font-weight:800;font-size:17px;cursor:pointer}
.go:disabled{opacity:.5;cursor:not-allowed}
.err{color:#d6455d;font-size:14px;min-height:20px;margin:0 0 10px}
.ok{text-align:center;padding:30px 10px}
.ok b{display:block;font-size:24px;color:var(--ok);margin-bottom:8px}
.brand{display:flex;align-items:center;gap:16px;margin-bottom:28px}
.logo{position:relative;display:block;width:64px;height:64px;flex:none}
.logo::before{content:"";position:absolute;inset:0;transform:translate(5px,5px);border-radius:50%;background:#ffc21a}
.logo img{position:relative;display:block;width:64px;height:64px;border-radius:50%}
.wordmark{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:34px;letter-spacing:-.025em;line-height:1;color:var(--ink)}
.wordmark small{display:block;font-family:Manrope,system-ui,sans-serif;font-weight:600;font-size:13px;letter-spacing:.01em;color:var(--mute);margin-top:5px}
h1{font-family:Fraunces,Georgia,serif;font-weight:600;letter-spacing:-.02em}
[hidden]{display:none!important}
</style>

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function chip(html, on, disabled){
  const b = document.createElement("button");
  b.type = "button"; b.className = "chip"; b.innerHTML = html;
  b.setAttribute("aria-pressed","false"); b.disabled = !!disabled; b.onclick = on;
  return b;
}
function select(box, btn){
  box.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed","false"));
  btn.setAttribute("aria-pressed","true");
}
// расписание берётся из МойКласс через server.js
// расписание приходит из МойКласс через /api/schedule (кэш Vercel 30 с, поэтому быстро)
async function loadSchedule(fresh){
  const daysBox = $("days");
  if(!fresh && window.SCHEDULE && window.SCHEDULE.days){
    schedule = window.SCHEDULE.days;
  }else{
    if(!Object.keys(schedule).length) daysBox.textContent = "Загружаем расписание…";
    try{
      const r = await fetch(BACKEND+"/api/schedule"+(fresh ? "?fresh="+Date.now() : ""));
      if(!r.ok) throw 0;
      schedule = (await r.json()).days || {};
    }catch(e){ daysBox.textContent = "Не удалось загрузить расписание. Обновите страницу."; return; }
  }
  daysBox.textContent = "";
  Object.keys(schedule).forEach(d => {
    const dt = new Date(d+"T12:00:00");
    const hasFree = schedule[d].some(s => s.free);
    const b = chip(DAYS[dt.getDay()]+"<small>"+dt.getDate()+" "+MONTHS[dt.getMonth()]+"</small>", ()=>{
      select(daysBox, b); date = d; lessonId = 0; showTimes();
    }, !hasFree);
    if(d === date){ b.setAttribute("aria-pressed","true"); }
    daysBox.appendChild(b);
  });
  if(date) showTimes();
}
function showTimes(){
  const box = $("times"); box.textContent = "";
  const slots = schedule[date] || [];
  if(!slots.some(s => s.free)){ box.textContent = "На этот день мест нет, выберите другой"; return; }
  slots.forEach(s => {
    const b = chip(esc(s.time)+(s.title ? "<small>"+esc(s.title)+"</small>" : ""), ()=>{ select(box,b); lessonId = s.lessonId; }, !s.free);
    if(s.lessonId === lessonId) b.setAttribute("aria-pressed","true");
    box.appendChild(b);
  });
}
loadSchedule();

function cleanPhone(v){
  let p = v.replace(/\D/g,"");
  if(p.length===11 && p[0]==="8") p = "7"+p.slice(1);
  return p.length===11 ? "+"+p : "";
}
// если человек ввёл имя и телефон, но ушёл со страницы не записавшись — админ получит контакт, чтобы перезвонить
function sendLead(){
  const phone = cleanPhone($("phone").value), name = $("name").value.trim();
  if(booked || leadSent || !phone || !name) return;
  leadSent = true;
  const data = new Blob([JSON.stringify({name,phone,ig})], {type:"application/json"});
  if(!(navigator.sendBeacon && navigator.sendBeacon(BACKEND+"/api/lead", data)))
    fetch(BACKEND+"/api/lead",{method:"POST",headers:{"Content-Type":"application/json"},body:data,keepalive:true}).catch(()=>{});
}
addEventListener("pagehide", sendLead);
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "hidden") sendLead(); });

const MESSAGES = {
  taken: "Это время только что заняли, выберите другое",
  gone: "Это занятие уже недоступно, выберите другое",
  already: "Вы уже записаны на это занятие",
  used: "На этот номер уже есть пробный урок — он бывает один раз. Если нужно перенести, напишите нам.",
};
$("go").onclick = async () => {
  const name = $("name").value.trim(), phone = cleanPhone($("phone").value);
  const err = $("err"); err.textContent = "";
  if(!date) return err.textContent = "Выберите день";
  if(!lessonId) return err.textContent = "Выберите время";
  if(!name) return err.textContent = "Введите имя";
  if(!phone) return err.textContent = "Введите номер в формате +7 7XX XXX XX XX";
  $("go").disabled = true; $("go").textContent = "Записываем…";
  try{
    const r = await fetch(BACKEND+"/api/book",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,phone,lessonId,ig})});
    const data = await r.json();
    if(!r.ok) throw new Error(data.error || "Ошибка");
    booked = true; $("form").hidden = true; $("done").hidden = false;
    $("doneText").textContent = name+", ждём вас "+data.date.split("-").reverse().join(".")+" в "+data.time+(data.title ? " ("+data.title+")" : "")+". Подтверждение придёт в WhatsApp.";
  }catch(e){
    err.textContent = MESSAGES[e.message] || "Не получилось записать. Попробуйте ещё раз.";
    $("go").disabled = false; $("go").textContent = "Записаться на урок";
    if(e.message==="taken" || e.message==="gone"){ lessonId = 0; loadSchedule(true); }
  }
};
</script>
