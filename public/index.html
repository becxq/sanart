<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sanart — запись на урок</title>
<link rel="icon" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet"></noscript>
<style>
:root{--bg:#e8e8ea;--card:#f9f9f9;--ink:#26262a;--mute:#69696f;--line:#cbcbd0;--accent:#ffc21a;--on:#1f1f22;--ok:#26262a}
@media (prefers-color-scheme:dark){:root{--bg:#1d1d20;--card:#2a2a2e;--ink:#f1f1f2;--mute:#a7a7ad;--line:#3f3f44;--accent:#ffc21a;--on:#1f1f22;--ok:#ffc21a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;line-height:1.5}
body{border-top:8px solid #ffc21a}
main{max-width:520px;margin:0 auto;padding:28px 18px 48px}
h1{font-size:30px;line-height:1.15;margin:0 0 6px;font-weight:800}
p.sub{margin:0 0 24px;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;margin-bottom:14px}
h2{font-size:15px;margin:0 0 12px;font-weight:600;color:var(--mute)}
.grid{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:18px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer}
.chip small{display:block;font-weight:400;color:var(--mute);font-size:12px}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on)}
.chip[aria-pressed=true] small{color:inherit}
.chip:disabled{opacity:.4;cursor:not-allowed;text-decoration:line-through}
.chip:focus-visible,input:focus-visible,.go:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
label{display:block;font-weight:600;font-size:14px;margin-bottom:12px}
input{width:100%;margin-top:6px;padding:12px;border:1px solid var(--line);border-radius:16px;font:inherit;background:transparent;color:var(--ink)}
.go{width:100%;padding:15px;border:0;border-radius:999px;background:var(--accent);color:var(--on);font:inherit;font-weight:800;font-size:17px;cursor:pointer}
.go:disabled{opacity:.5;cursor:not-allowed}
.err{color:#d6455d;font-size:14px;min-height:20px;margin:0 0 10px}
.ok{text-align:center;padding:30px 10px}
.ok b{display:block;font-size:24px;color:var(--ok);margin-bottom:8px}
.brand{display:flex;align-items:center;gap:16px;margin-bottom:28px}
.logo{position:relative;display:block;width:64px;height:64px;flex:none}
.logo::before{content:"";position:absolute;inset:0;transform:translate(5px,5px);border-radius:50%;background:#ffc21a}
.logo img{position:relative;display:block;width:64px;height:64px;border-radius:50%}
.wordmark{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:34px;letter-spacing:-.025em;line-height:1;color:var(--ink)}
.wordmark small{display:block;font-family:Manrope,system-ui,sans-serif;font-weight:600;font-size:13px;letter-spacing:.01em;color:var(--mute);margin-top:5px}
h1{font-family:Fraunces,Georgia,serif;font-weight:600;letter-spacing:-.02em}
[hidden]{display:none!important}
.note{margin:12px 0 0;color:var(--mute);font-size:14px}
.empty{color:var(--mute)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
</style>
</head>
<body>
<main>
<header class="brand"><span class="logo"><img src="/logo.png" alt="Логотип sanart" width="64" height="64"></span><span class="wordmark">sanart<small>студия</small></span></header>
<div id="form">
  <h1>Запишитесь на пробный урок</h1>
  <p class="sub">Выберите день и время, а подтверждение придёт в WhatsApp.</p>
  <div class="card"><h2>День</h2><div class="grid" id="days"><span class="empty">Загружаем расписание…</span></div><p class="note" id="note" hidden></p></div>
  <div class="card"><h2>Время</h2><div class="grid" id="times"><span class="empty">Сначала выберите день</span></div></div>
  <div class="card"><h2>Инструмент</h2><div class="grid" id="instruments"><span class="empty">Сначала выберите время</span></div></div>
  <div class="card">
    <label>Имя<input id="name" autocomplete="name" maxlength="100" placeholder="Как к вам обращаться"></label>
    <label style="margin:0">Номер телефона<input id="phone" type="tel" autocomplete="tel" inputmode="tel" placeholder="+7 7XX XXX XX XX"></label>
    <label class="hp" aria-hidden="true">Сайт<input id="website" tabindex="-1" autocomplete="off"></label>
  </div>
  <p class="err" id="err" role="alert"></p>
  <button class="go" id="go">Записаться</button>
</div>
<div id="done" class="card ok" hidden>
  <b>Вы записаны!</b>
  <span id="doneText"></span>
</div>
</main>
<script>
// Расписание и запись — через функции Vercel /api/* (данные из МойКласс).
const ig = (new URLSearchParams(location.search).get("ig") || "").slice(0, 100); // ID из Instagram-бота: ?ig=…
const WD = ["вс","пн","вт","ср","чт","пт","сб"];
const WD_FULL = ["воскресенье","понедельник","вторник","среда","четверг","пятница","суббота"];
const MON = ["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
const MON_FULL = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const day = d => new Date(d + "T12:00:00");

let data = null;              // ответ /api/schedule
let date = "", time = "", classId = 0, booked = false, booking = false, leadSent = false;

function chip(html, pressed, disabled, onclick){
  const b = document.createElement("button");
  b.type = "button"; b.className = "chip"; b.innerHTML = html;
  b.setAttribute("aria-pressed", pressed ? "true" : "false");
  b.disabled = !!disabled; b.onclick = onclick;
  return b;
}
const placeholder = (box, text) => { box.innerHTML = '<span class="empty">' + esc(text) + "</span>"; };
const slots = () => (data && data.days[date]) || [];
const slot = () => slots().find(s => s.time === time);

function render(){
  // дни
  const days = $("days"); days.textContent = "";
  for (const d of Object.keys(data.days)) {
    const dt = day(d);
    days.appendChild(chip(esc(WD[dt.getDay()]) + "<small>" + dt.getDate() + " " + MON[dt.getMonth()] + "</small>",
      d === date, !data.days[d].length, () => { date = d; time = ""; classId = 0; render(); }));
  }
  const note = $("note");
  const firstFree = Object.keys(data.days).find(d => data.days[d].length);
  note.hidden = !(data.nothingFree || data.weeksAhead > 0);
  if (data.nothingFree) note.textContent = "Свободного времени пока нет. Напишите нам — подберём время.";
  else if (data.weeksAhead > 0 && firstFree) {
    const dt = day(firstFree);
    note.textContent = "Ближайшие дни заняты. Первое свободное время — " + WD_FULL[dt.getDay()] + ", " + dt.getDate() + " " + MON_FULL[dt.getMonth()] + ".";
  }

  // время
  const times = $("times");
  if (!date) placeholder(times, "Сначала выберите день");
  else {
    times.textContent = "";
    for (const s of slots())
      times.appendChild(chip(esc(s.time), s.time === time, false, () => {
        time = s.time;
        if (!s.classIds.includes(classId)) classId = 0; // инструмент недоступен в это время
        render();
      }));
  }

  // инструменты
  const box = $("instruments"), s = slot();
  if (!s) placeholder(box, date ? "Сначала выберите время" : "Сначала выберите день и время");
  else {
    box.textContent = "";
    for (const i of data.instruments)
      box.appendChild(chip(esc(i.name), i.classId === classId, !s.classIds.includes(i.classId), () => { classId = i.classId; render(); }));
  }
}

async function loadSchedule(fresh){
  try {
    const r = await fetch("/api/schedule" + (fresh ? "?fresh=" + Date.now() : ""));
    if (!r.ok) throw 0;
    data = await r.json();
  } catch (e) { placeholder($("days"), "Не удалось загрузить расписание. Обновите страницу."); return; }
  if (date && !(data.days[date] || []).length) date = "";
  if (!slot()) { time = ""; classId = 0; }
  else if (!slot().classIds.includes(classId)) classId = 0;
  render();
}
loadSchedule();

// 8XXXXXXXXXX, 7XXXXXXXXXX, +7…, 10 цифр → +7XXXXXXXXXX (или "", если номер неполный)
function cleanPhone(v){
  let p = String(v).replace(/\D/g, "");
  if (p.length === 10) p = "7" + p;
  if (p.length === 11 && p[0] === "8") p = "7" + p.slice(1);
  return p.length === 11 && p[0] === "7" ? "+" + p : "";
}

// ввёл имя и телефон, но ушёл, не записавшись, — админ получит контакт, чтобы перезвонить (один раз)
function sendLead(){
  const phone = cleanPhone($("phone").value), name = $("name").value.trim();
  if (booked || booking || leadSent || !phone || !name) return; // во время записи — не «ушёл»
  leadSent = true;
  const body = JSON.stringify({ name, phone, ig });
  const sent = navigator.sendBeacon && navigator.sendBeacon("/api/lead", new Blob([body], { type: "application/json" }));
  if (!sent) fetch("/api/lead", { method: "POST", headers: { "Content-Type": "application/json" }, body, keepalive: true }).catch(() => {});
}
addEventListener("pagehide", sendLead);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") sendLead(); });

const MESSAGES = {
  taken: "Это время только что заняли",
  used: "На этот номер уже есть пробный урок — он бывает один раз. Если нужно перенести, напишите нам.",
  already: "Вы уже записаны на это время. Подтверждение — в WhatsApp.",
  late: "На это время записаться уже нельзя, выберите другое",
};
$("go").onclick = async () => {
  const name = $("name").value.trim(), phone = cleanPhone($("phone").value), err = $("err");
  err.textContent = "";
  if (!date) return err.textContent = "Выберите день";
  if (!time) return err.textContent = "Выберите время";
  if (!classId) return err.textContent = "Выберите инструмент";
  if (!name) return err.textContent = "Введите имя";
  if (!phone) return err.textContent = "Введите номер в формате +7 7XX XXX XX XX";
  const go = $("go"); go.disabled = true; go.textContent = "Записываем…"; booking = true;
  let code = "";
  try {
    const r = await fetch("/api/book", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ date, time, classId, name, phone, ig, website: $("website").value }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok || !d.ok) { code = d.error || ""; throw 0; }
    booked = true; $("form").hidden = true; $("done").hidden = false;
    $("doneText").textContent = name + ", ждём вас " + d.date.split("-").reverse().join(".") + " в " + d.time
      + (d.title ? " (" + d.title + ")" : "") + ". Подтверждение придёт в WhatsApp.";
  } catch (e) {
    booking = false;
    err.textContent = MESSAGES[code] || "Не получилось записать. Попробуйте ещё раз.";
    go.disabled = false; go.textContent = "Записаться";
    if (code === "taken" || code === "late") { time = ""; classId = 0; loadSchedule(true); }
  }
};
</script>
</body>
</html>
